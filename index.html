<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider-Man: Miles Morales Capture Gallery</title>
  
  <link rel="icon" type="image/png" href="miles.png">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
  
  <style>
    *, *::after, *::before { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      background-color: #030305;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* BASE BACKGROUND CANVAS */
    .container {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      background-size: cover;
      background-position: center;
      transition: background-image 0.6s ease-in-out;
      overflow: hidden;
    }

    /* FROSTED GLASS TRANSLUCENT COATING LAYER OVER BACKDROP */
    .glass-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 6, 10, 0.5);
      backdrop-filter: blur(25px) saturate(140%);
      -webkit-backdrop-filter: blur(25px) saturate(140%);
      z-index: 1;
    }

    /* STYLIZED EMBEDDED MAKER SIGNATURE HEADER BADGE */
    .info {
      position: absolute;
      z-index: 20;
      top: 25px;
      left: 25px;
      text-transform: uppercase;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.75rem;
      letter-spacing: 4px;
      color: #ffffff;
      background: rgba(229, 27, 36, 0.1);
      border: 1px solid #e51b24;
      padding: 8px 16px;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(229, 27, 36, 0.25), inset 0 0 8px rgba(229, 27, 36, 0.15);
      text-shadow: 0 0 5px #fff;
    }

    .info span {
      color: #e51b24;
      font-weight: 900;
      text-shadow: 0 0 8px rgba(229, 27, 36, 0.6);
    }

    /* CREDITS LOGO LAYER (miles.png) */
    .maker-logo {
      position: absolute;
      z-index: 20;
      top: 20px;
      right: 25px;
      height: 50px;
    }

    .maker-logo img {
      height: 100%;
      filter: drop-shadow(0 0 8px rgba(229, 27, 36, 0.6));
    }

    /* CAROUSEL GEOMETRY PORTALS */
    .center {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%);
      user-select: none;
      z-index: 5;
    }

    .items {
      transform-origin: center 250vh;
      transform: rotate(0);
      user-select: none;
      display: flex;
      will-change: transform;
    }

    .item {
      position: absolute;
      user-select: none;
      cursor: pointer;
      transform: translateX(-50%);
      transform-origin: center 250vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* SCREENSHOT CARDS STYLE */
    .card {
      display: block;
      width: 500px;
      height: 281px;
      border-radius: 14px;
      overflow: hidden;
      cursor: grab;
      position: relative;
      border: 3px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .card:active { cursor: grabbing; }

    /* HIGHLIGHT ACTIVE CARD */
    .item.featured-active .card {
      border-color: #e51b24;
      box-shadow: 0 0 30px rgba(229, 27, 36, 0.4);
    }

    .image {
      height: 100%;
      width: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    /* FULLSCREEN VIEWING LIGHTBOX OVERLAY */
    .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(4, 5, 8, 0.98);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
      cursor: zoom-out;
      gap: 20px;
    }

    .lightbox-overlay.is-open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-overlay img {
      max-width: 92%;
      max-height: 75%;
      object-fit: contain;
      border-radius: 10px;
      border: 3px solid #e51b24;
      box-shadow: 0 0 45px rgba(229, 27, 36, 0.4);
      transform: scale(0.85);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lightbox-overlay.is-open img { transform: scale(1); }

    /* EXPANDED VIEW IMAGE TITLES STYLING */
    .lightbox-title {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ffffff;
      text-align: center;
      max-width: 85%;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .lightbox-hint {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.7rem;
      color: #e51b24;
      opacity: 0.8;
    }

    /* RESPONSIVE SCALING FOR PHONES */
    @media (max-width: 768px) {
      .center { top: 44%; }
      .items { transform-origin: center 180vh; }
      .item { transform-origin: center 180vh; }
      .card { width: 290px; height: 163px; }
      .info { font-size: 0.6rem; top: 15px; left: 15px; letter-spacing: 2px; padding: 6px 12px; }
      .maker-logo { height: 35px; top: 12px; right: 15px; }
      .lightbox-title { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container" id="blur-bg">
    
    <div class="glass-overlay"></div>
    
    <div class="info">
      MADE BY <span>RISHI ROHITH</span>
    </div>

    <div class="maker-logo">
      <img src="miles.png" alt="Spider-Man Logo Badge" />
    </div>

    <div class="center">
      <div class="items"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox-overlay">
    <img id="lightbox-img" src="" alt="Full Scale Capture" />
    <div id="lightbox-title" class="lightbox-title"></div>
    <div class="lightbox-hint">TAP ANYWHERE TO RETURN</div>
  </div>

  <script>
    gsap.registerPlugin(Draggable);

    const imageTitles = [
      "power within", "purple reign", "responsibilities", "skiing in new york", "snowy manhattan", "thats all it is a leap of faith", "was it worth it", "world of acrobatics", "acrobatics 1", "aint as simple as it looks", "creepy crawler", "criterion 2", "criterion", "dont mess with the spider", "gold n gunz", "its bitsy spider", "its in my DNA", "kaboom!", "last dance", "like an angel", "look into my eyes", "nah ima do my own thing now", "no matter how many times i fall i always get back up", "nothing personal", "one day ima be in the avengers", "YN", "2 sides of the same coin", "42nd & Broadway", "Divin down", "I HAVE THE POWER!!!", "I’m done pulling my punches.", "Parallel Paths", "Prowler & Pupil", "Rise Of Miles", "THE BOY WHO GOT BIT BY A SPIDER", "THE ENERGY FLOWS", "Unstoppable flight", "Uptown Pride"
    ];

    const itemsContainer = document.querySelector(".items");
    const blurBackground = document.getElementById("blur-bg");
    let currentAudio = null;
    let mainDraggable = null;
    
    const imageSize = imageTitles.length;
    const degree = 3.5; 
    const midIndex = (imageSize - 1) / 2;
    const maxScrollLimit = midIndex * degree;

    const formatDisplayTitle = (rawText) => {
      return rawText
        .split(' ')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    };

    // --- HTML INJECTION ---
    const buildGallery = () => {
      let htmlContent = "";
      imageTitles.forEach((title) => {
        const cleanTitle = title.replace(/"/g, '&quot;');
        const formattedTitle = formatDisplayTitle(title);
        htmlContent += `
          <div class="item" data-audio="audio/${cleanTitle}.mp3" data-img-src="spdr/${cleanTitle}.png" data-title="${formattedTitle}">
            <div class="card">
              <img class="image" src="spdr/${cleanTitle}.png" alt="${cleanTitle}" />
            </div>
          </div>
        `;
      });
      itemsContainer.innerHTML = htmlContent;
    };

    buildGallery();

    const items = gsap.utils.toArray(".item");

    // --- INITIAL FINITE ARRAYS ALIGNMENT TRACKS ---
    const init = () => {
      items.forEach((image, index) => {
        const targetRotation = (index - midIndex) * degree;
        
        gsap.set(image, {
          transformOrigin: "center 250vh",
          rotation: targetRotation,
          scale: 1
        });
      });
      
      checkActiveCard();
    };

    // --- EVALUATE CENTER CARD AND UPDATE BLUR BACKGROUND ---
    const checkActiveCard = () => {
      const containerRotation = gsap.getProperty(".items", "rotation");
      
      let targetActiveItem = null;
      let closestAngleOffset = Infinity;

      items.forEach((item) => {
        item.classList.remove("featured-active");
        
        const elementRotation = gsap.getProperty(item, "rotation");
        const trueNetAngle = elementRotation + containerRotation;
        
        const absoluteDelta = Math.abs(trueNetAngle);
        if (absoluteDelta < closestAngleOffset) {
          closestAngleOffset = absoluteDelta;
          targetActiveItem = item;
        }
      });

      if (targetActiveItem) {
        targetActiveItem.classList.add("featured-active");
        const activeImgSrc = targetActiveItem.getAttribute("data-img-src");
        blurBackground.style.backgroundImage = `url('${activeImgSrc}')`;
      }
    };

    // --- CLEAN TRACK AUDIO PIPELINE CONTROL ---
    const playSong = (src) => {
      if (!src) return;
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      currentAudio = new Audio(src);
      currentAudio.loop = true;
      currentAudio.volume = 0;
      currentAudio.play().then(() => {
        gsap.to(currentAudio, { volume: 1, duration: 0.5 });
      }).catch(err => console.log("Audio waiting for interaction context", err));
    };

    const stopSong = () => {
      if (currentAudio) {
        gsap.to(currentAudio, { 
          volume: 0, 
          duration: 0.3, 
          onComplete: () => {
            if(currentAudio) {
              currentAudio.pause();
              currentAudio = null;
            }
          } 
        });
      }
    };

    // --- SNAP TO CLOSEST INCREMENT ---
    const snapToCard = (targetRotation) => {
      const snappedRotation = Math.round(targetRotation / degree) * degree;
      const boundedRotation = Math.max(-maxScrollLimit, Math.min(maxScrollLimit, snappedRotation));

      gsap.to(".items", {
        rotation: boundedRotation,
        duration: 0.45,
        ease: "power2.out",
        onUpdate: checkActiveCard,
        onComplete: () => {
          if (mainDraggable && mainDraggable[0]) {
            mainDraggable[0].update();
          }
          checkActiveCard();
        }
      });
    };

    // --- DRAGGABLE & MOUSE WHEEL CONFIGURATION ---
    const draggable = () => {
      mainDraggable = Draggable.create(".items", {
        type: "rotation",
        inertia: true,
        bounds: { minRotation: -maxScrollLimit, maxRotation: maxScrollLimit },
        onDrag: checkActiveCard,
        onThrowUpdate: checkActiveCard,
        onDragEnd: function () {
          snapToCard(this.rotation);
        }
      });

      // MOUSE WHEEL SCROLL PORT LISTENERS
      window.addEventListener("wheel", (e) => {
        e.preventDefault();

        const currentRotation = gsap.getProperty(".items", "rotation");
        const scrollDirection = e.deltaY > 0 ? -1 : 1; 
        const nextTargetRotation = currentRotation + (scrollDirection * degree);

        snapToCard(nextTargetRotation);
      }, { passive: false });
    };

    // --- LIGHTBOX INTERACTIVE EXPAND CONTROL ENGINE ---
    const setupLightbox = () => {
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightbox-img");
      const lightboxTitleText = document.getElementById("lightbox-title");
      const allCards = document.querySelectorAll(".card");
      let lastTapTime = 0;

      allCards.forEach((card) => {
        const handleExpandAction = () => {
          const imgInside = card.querySelector(".image");
          const parentItem = card.parentElement;
          
          if (imgInside && parentItem) {
            lightboxImg.src = imgInside.src;
            lightboxTitleText.innerText = parentItem.getAttribute("data-title");
            lightbox.classList.add("is-open");
            
            const associatedAudio = parentItem.getAttribute("data-audio");
            playSong(associatedAudio);
          }
        };

        card.addEventListener("dblclick", handleExpandAction);

        card.addEventListener("touchstart", (e) => {
          const currentTime = new Date().getTime();
          const tapDelay = currentTime - lastTapTime;
          if (tapDelay < 300 && tapDelay > 0) {
            e.preventDefault();
            handleExpandAction();
          }
          lastTapTime = currentTime;
        });
      });

      lightbox.addEventListener("click", () => {
        lightbox.classList.remove("is-open");
        stopSong();
      });
    };

    init();
    draggable();
    setupLightbox();
  </script>
</body>
</html>
